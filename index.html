<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشبكة السورية الكبرى | Elite Matrix</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --border-color: #222b3b;
            --accent-color: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; display: flex; justify-content: center; }
        
        .app-container { width: 100%; max-width: 600px; }
        
        /* الهيدر الاحترافي الفخم */
        header { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color);
            padding: 20px; 
            text-align: center; 
            border-radius: 16px; 
            font-size: 1.4rem; 
            font-weight: 800; 
            margin-bottom: 20px; 
            background-image: linear-gradient(to bottom, #151a23, #10141c);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
            color: #fff;
            border-bottom: 3px solid #00f2fe;
        }

        /* شريط القصص (Stories) الفاخر */
        .stories-wrapper { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
        .story-item { min-width: 75px; height: 75px; border-radius: 50%; background: var(--accent-gradient); padding: 2px; cursor: pointer; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
        .story-avatar { width: 100%; height: 100%; background: var(--card-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: #fff; font-weight: 600; text-align: center; overflow: hidden; padding: 4px; }

        /* صناديق النشر والإدخال */
        .card-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0.3); }
        
        .input-group { margin-bottom: 12px; }
        input[type="text"], textarea { 
            width: 100%; 
            background: #0d1117; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            color: #fff; 
            padding: 14px; 
            font-size: 0.95rem; 
            outline: none; 
            transition: all 0.3s ease; 
        }
        input[type="text"]:focus, textarea:focus { border-color: #00f2fe; box-shadow: 0 0 10px rgba(0,242,254,0.2); }
        textarea { height: 100px; resize: none; }
        
        .btn-primary { 
            background: var(--accent-gradient); 
            color: #0b0e14; 
            border: none; 
            padding: 14px; 
            border-radius: 10px; 
            width: 100%; 
            font-size: 1rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: transform 0.2s, opacity 0.2s; 
            box-shadow: 0 4px 15px rgba(0,242,254,0.3);
        }
        .btn-primary:active { transform: scale(0.98); }

        /* تصميم كرت المنشورات الاحترافي */
        .post-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .post-header { display: flex; align-items: center; margin-bottom: 12px; }
        .post-author { font-weight: 700; color: #00f2fe; font-size: 1.05rem; }
        .post-content { font-size: 1rem; line-height: 1.6; color: #cbd5e1; word-break: break-word; margin-bottom: 14px; }
        
        .media-box { width: 100%; max-height: 400px; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; }
        .media-box img, .media-box video { width: 100%; max-height: 400px; object-fit: contain; }

        .post-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 12px; font-size: 0.85rem; color: var(--text-muted); }
        
        .like-btn { 
            background: rgba(255, 71, 87, 0.1); 
            border: 1px solid rgba(255, 71, 87, 0.3); 
            color: #ff4757; 
            padding: 8px 16px; 
            font-size: 0.9rem; 
            border-radius: 8px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            font-weight: 600;
            transition: background 0.2s;
        }
        .like-btn:hover { background: rgba(255, 71, 87, 0.2); }
        
        .status-text { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="app-container">
    <header>الشبكة السورية الكبرى ⚡</header>

    <!-- شريط القصص -->
    <div class="stories-wrapper" id="storiesBar">
        <div class="story-item">
            <div class="story-avatar">قصص</div>
        </div>
    </div>

    <!-- صندوق إضافة قصة -->
    <div class="card-box" style="padding: 14px;">
        <div style="display: flex; gap: 10px;">
            <input type="text" id="storyMediaUrl" placeholder="رابط صورة أو فيديو للقصة..." style="margin-bottom:0;">
            <button class="btn-primary" onclick="createStory()" style="width: 130px; padding: 10px;">نشر قصة</button>
        </div>
    </div>

    <!-- صندوق النشر الرئيسي -->
    <div class="card-box">
        <div class="input-group">
            <input type="text" id="authorName" placeholder="اسمك الكريم..." value="أحمد علي عمران">
        </div>
        <div class="input-group">
            <textarea id="postContent" placeholder="بشو عم تخطط يا ملك؟..."></textarea>
        </div>
        <div class="input-group">
            <input type="text" id="mediaUrl" placeholder="رابط صورة أو فيديو (اختياري)..." style="margin-bottom: 14px;">
        </div>
        <button class="btn-primary" onclick="createPost()">نشر في الإمبراطورية 🚀</button>
    </div>

    <div id="serverStatus" class="status-text"></div>

    <!-- حائط المنشورات -->
    <div id="postsFeed">
        <p style="text-align: center; color: var(--text-muted); padding: 20px;">جاري إيقاظ السيرفر وتحميل البيانات...</p>
    </div>
</div>

<script>
    const API_URL = "https://syrian-social-matrix.onrender.com";

    async function fetchFeed() {
        let statusEl = document.getElementById("serverStatus");
        statusEl.innerText = "جاري الاتصال بقاعدة البيانات السحابية...";
        try {
            let res = await fetch(`${API_URL}/api/feed`);
            let data = await res.json();
            let feed = document.getElementById("postsFeed");
            statusEl.innerText = "";

            if (data.feed.length === 0) {
                feed.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 20px;">الإمبراطورية جاهزة ولا توجد منشورات بعد.. انشر أول منشور! 🔥</p>';
                return;
            }

            feed.innerHTML = "";
            data.feed.forEach(p => {
                let card = document.createElement("div");
                card.className = "post-card";
                
                let mediaHtml = "";
                if (p.media_url) {
                    if (p.media_url.includes(".mp4") || p.media_url.includes("video")) {
                        mediaHtml = `<div class="media-box"><video src="${p.media_url}" controls></video></div>`;
                    } else {
                        mediaHtml = `<div class="media-box"><img src="${p.media_url}" alt="Media"></div>`;
                    }
                }

                card.innerHTML = `
                    <div class="post-header">
                        <div class="post-author">${p.author}</div>
                    </div>
                    <div class="post-content">${p.content}</div>
                    ${mediaHtml}
                    <div class="post-footer">
                        <span>${p.timestamp}</span>
                        <button class="like-btn" onclick="likePost(${p.id})">❤️ <span id="likes-${p.id}">${p.likes}</span></button>
                    </div>
                `;
                feed.appendChild(card);
            });
        } catch (e) {
            document.getElementById("postsFeed").innerHTML = '<p style="text-align: center; color: #ff4757; padding: 20px;">فشل الاتصال بالسيرفر. (جاري إيقاظه، يرجى تحديث الصفحة بعد ثوانٍ) ⚠️</p>';
            statusEl.innerText = "";
        }
    }

    async function createPost() {
        let author = document.getElementById("authorName").value.trim();
        let content = document.getElementById("postContent").value.trim();
        let media_url = document.getElementById("mediaUrl").value.trim();

        if (!content && !media_url) {
            alert("ما يصير تنشر فراغ يا ملك!");
            return;
        }

        try {
            let res = await fetch(`${API_URL}/api/post/create`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ author, content, media_url })
            });

            if (res.ok) {
                document.getElementById("postContent").value = "";
                document.getElementById("mediaUrl").value = "";
                fetchFeed();
            } else {
                alert("حدث خطأ أثناء النشر.");
            }
        } catch (e) {
            alert("فشل الاتصال بالسيرفر.");
        }
    }

    async function likePost(id) {
        try {
            let res = await fetch(`${API_URL}/api/post/like/${id}`, { method: "POST" });
            let data = await res.json();
            document.getElementById(`likes-${id}`).innerText = data.likes;
        } catch (e) {}
    }

    async function fetchStories() {
        try {
            let res = await fetch(`${API_URL}/api/stories`);
            let data = await res.json();
            let bar = document.getElementById("storiesBar");
            
            bar.innerHTML = `<div class="story-item"><div class="story-avatar">قصص</div></div>`;

            data.stories.forEach(s => {
                let div = document.createElement("div");
                div.className = "story-item";
                div.innerHTML = `<div class="story-avatar">${s.author}</div>`;
                div.onclick = () => window.open(s.media_url, '_blank');
                bar.appendChild(div);
            });
        } catch (e) {}
    }

    async function createStory() {
        let author = document.getElementById("authorName").value.trim() || "الـ GOAT";
        let media_url = document.getElementById("storyMediaUrl").value.trim();

        if (!media_url) {
            alert("أدخل رابط القصة أولاً!");
            return;
        }

        let res = await fetch(`${API_URL}/api/story/create`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ author, media_url })
        });

        if (res.ok) {
            document.getElementById("storyMediaUrl").value = "";
            fetchStories();
            alert("تم نشر القصة بنجاح 🚀");
        }
    }

    fetchFeed();
    fetchStories();
</script>

</body>
</html>
